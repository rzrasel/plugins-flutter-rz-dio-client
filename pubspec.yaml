name: rz_dio_client
description: |
  A reusable Dio client package with interceptors, cancel token manager,
  API response wrapper, and support for auth token + timeout configuration.
version: 0.0.8
homepage: https://github.com/rzrasel/flutter-plugins-rz-dio-client
repository: https://github.com/rzrasel/flutter-plugins-rz-dio-client
documentation: https://github.com/rzrasel/flutter-plugins-rz-dio-client

environment:
  sdk: ^3.13.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0
  plugin_platform_interface: ^2.1.8
  #
  dio: ^5.11.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

  plugin:
    platforms:
      android:
        package: com.rzrasel.rz_dio_client
        pluginClass: RzDioClientPlugin
      ios:
        pluginClass: RzDioClientPlugin
      linux:
        pluginClass: RzDioClientPlugin
      macos:
        pluginClass: RzDioClientPlugin
      windows:
        pluginClass: RzDioClientPluginCApi
      web:
        pluginClass: RzDioClientWeb
        fileName: rz_dio_client_web.dart

